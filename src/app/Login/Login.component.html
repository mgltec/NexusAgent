<p-toast></p-toast>

<div class="login-wrapper" *ngIf="showLoginForm">
  <div class="login-container">
    <div class="login-card">
      <!-- Brand Header -->
      <div class="login-header">
        <img src="assets/icons/nexus-agent.svg" alt="Nexus Agent" class="brand-icon" />
        <h1 class="brand-title">Nexus <strong>Agent</strong></h1>
        <p class="brand-subtitle">NEXUS GAMING SOLUTIONS</p>
      </div>

      <!-- Login Form -->
      <form [formGroup]="form" (ngSubmit)="submitForm()" class="login-form">
        <!-- Username Input -->
        <div class="form-group-modern">
          <label for="txtUser" class="form-label">
            <i class="fas fa-user"></i>
            Username
          </label>
          <div class="input-wrapper">
            <input
              type="text"
              [formControlName]="'username'"
              class="form-control-modern"
              id="txtUser"
              placeholder="Enter your username"
              [class.error]="f.username.dirty && f.username.errors?.required"
            >
          </div>
          <small class="error-message" *ngIf="f.username.dirty && f.username.errors?.required">
            <i class="fas fa-exclamation-circle"></i>
            Username is required
          </small>
        </div>

        <!-- Password Input -->
        <div class="form-group-modern">
          <label for="txtPassword" class="form-label">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              [formControlName]="'password'"
              id="txtPassword"
              class="form-control-modern"
              placeholder="Enter your password"
              [class.error]="f.password.dirty && f.password.errors?.required"
            >
          </div>
          <small class="error-message" *ngIf="f.password.dirty && f.password.errors?.required">
            <i class="fas fa-exclamation-circle"></i>
            Password is required
          </small>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-login" [disabled]="_loadingReport">
          <span *ngIf="!_loadingReport">
            <i class="fas fa-sign-in-alt"></i>
            Sign In
          </span>
          <span *ngIf="_loadingReport" class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            Signing in...
          </span>
        </button>
      </form>

      <!-- Demo Credentials -->
      <button type="button" class="demo-credentials" (click)="fillDemo()">
        <span class="demo-label">Demo Access</span>
        <span class="demo-value">test2 / 123</span>
        <span class="demo-hint">Click to autofill</span>
      </button>

      <!-- Footer -->
      <div class="login-footer">
        <p class="footer-text">
          <i class="fas fa-lock"></i>
          Secure login &middot; &copy; 2026 Nexus Gaming Solutions
        </p>
      </div>
    </div>

    <!-- Feature Decoration -->
    <div class="stats-decoration">
      <div class="stat-item">
        <i class="fas fa-chart-line"></i>
        <span>Real-time Analytics</span>
      </div>
      <div class="stat-item">
        <i class="fas fa-users"></i>
        <span>Player Management</span>
      </div>
      <div class="stat-item">
        <i class="fas fa-dollar-sign"></i>
        <span>Financial Reports</span>
      </div>
    </div>
  </div>
</div>
